name: 'Build and Push Docker Image'
description: 'Build and push a Docker image to GitHub Container Registry'

inputs:
  service-dir:
    description: 'Service directory name containing Dockerfile'
    required: true
  image-name:
    description: 'Image name to push (e.g., amp-console)'
    required: true
  registry:
    description: 'Container registry URL'
    required: true
  registry-org:
    description: 'Registry organization/namespace'
    required: true
  tag:
    description: 'Image tag (usually release tag)'
    required: true
  context:
    description: 'Docker build context path (defaults to ./<service-dir>). Override to "." for builds that need the project root.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # required: true is documentation only — GitHub does not fail a run for a
    # missing input. Without this, an unset registry or org silently yields a tag
    # like "/wso2/amp-api:v1.0.0", and the build fails much later on an invalid
    # image reference that says nothing about the cause.
    - name: Verify the image reference is fully specified
      run: |
        missing=""
        [ -n "${REGISTRY}" ]   || missing="${missing} registry"
        [ -n "${REGISTRY_ORG}" ] || missing="${missing} registry-org"
        [ -n "${IMAGE_NAME}" ] || missing="${missing} image-name"
        [ -n "${TAG}" ]        || missing="${missing} tag"
        if [ -n "${missing}" ]; then
          echo "::error::Missing required input(s):${missing}. The caller must pass every part of the image reference." >&2
          exit 1
        fi
        echo "Publishing to ${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:${TAG}"
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_ORG: ${{ inputs.registry-org }}
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
      shell: bash

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context != '' && inputs.context || format('./{0}', inputs.service-dir) }}
        file: ./${{ inputs.service-dir }}/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ inputs.registry }}/${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.tag }}
        build-args: |
          VERSION=${{ inputs.tag }}

    - name: Log image details
      run: |
        echo "Built and pushed: ${{ inputs.registry }}/${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.tag }}"
      shell: bash
