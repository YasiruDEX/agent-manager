name: "Build and Push Docker Image that Supports only a Single Platform"
description: "Build and push a Docker image to GitHub Container Registry"

inputs:
  service-dir:
    description: "Service directory name containing Dockerfile"
    required: true
  image-name:
    description: "Image name to push (e.g., amp-console)"
    required: true
  registry:
    description: "Container registry URL"
    required: true
  registry-org:
    description: "Registry organization/namespace"
    required: true
  tag:
    description: "Image tag (usually release tag)"
    required: true
  platform:
    description: "Target platforms for the Docker image (e.g., linux/amd64)"
    required: true
  build-args:
    description: "Build arguments (multiline string, one per line)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # required: true is documentation only — GitHub does not fail a run for a
    # missing input. Without this, an unset registry or org silently yields a tag
    # like "/wso2/amp-api:v1.0.0", and the build fails much later on an invalid
    # image reference that says nothing about the cause.
    - name: Verify the image reference is fully specified
      run: |
        missing=""
        [ -n "${REGISTRY}" ]   || missing="${missing} registry"
        [ -n "${REGISTRY_ORG}" ] || missing="${missing} registry-org"
        [ -n "${IMAGE_NAME}" ] || missing="${missing} image-name"
        [ -n "${TAG}" ]        || missing="${missing} tag"
        if [ -n "${missing}" ]; then
          echo "::error::Missing required input(s):${missing}. The caller must pass every part of the image reference." >&2
          exit 1
        fi
        echo "Publishing to ${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:${TAG}"
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_ORG: ${{ inputs.registry-org }}
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
      shell: bash

    - name: Build Docker image
      run: |
        # Parse build-args into docker build format
        BUILD_ARGS=""
        if [ -n "$BUILD_ARGS_INPUT" ]; then
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then
              BUILD_ARGS="$BUILD_ARGS --build-arg $arg"
            fi
          done <<< "$BUILD_ARGS_INPUT"
        fi

        # Build the image using plain docker build
        # Context: ./${{ inputs.service-dir }}
        # Dockerfile: ./${{ inputs.service-dir }}/Dockerfile
        docker build \
          -f ./${{ inputs.service-dir }}/Dockerfile \
          -t ${{ inputs.registry }}/${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.tag }} \
          $BUILD_ARGS \
          ./${{ inputs.service-dir }}
      shell: bash
      env:
        BUILD_ARGS_INPUT: ${{ inputs.build-args }}

    - name: Push Docker image
      run: |
        docker push ${{ inputs.registry }}/${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.tag }}
      shell: bash

    - name: Log image details
      run: |
        echo "Built and pushed: ${{ inputs.registry }}/${{ inputs.registry-org }}/${{ inputs.image-name }}:${{ inputs.tag }}"
      shell: bash
